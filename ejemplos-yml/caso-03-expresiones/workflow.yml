name: Expresiones y condicionales

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a simular'
        required: false
        type: string
        default: 'master'

      nivel:
        description: 'Nivel de logs'
        required: false
        type: choice
        options:
          - debug
          - info
          - warning
          - error
        default: 'info'
      forzar_falla:
        description: 'Forzar falla para ver el status final'
        type: boolean
        default: false

jobs:
  evaluacion:
    runs-on: ubuntu-latest

    steps:
      - name: Operadores basicos
        run: |
          echo "Igualdad: ${{ inputs.branch == 'master' }}"
          echo "Desigualdad: ${{ inputs.branch != 'develop' }}"
          echo "AND:  ${{ inputs.branch == 'main' && inputs.nivel == 'info' }}"
          echo "OR:  ${{ inputs.branch == 'main' || inputs.nivel == 'error' }}"
          echo "NOT:  ${{ !(inputs.branch == 'develop') }}"
      
      - name: Funciones con el string
        run: |
          echo "contains: ${{ contains(inputs.branch, 'master') }}"
          echo "startsWith: ${{ startsWith(inputs.branch, 'ma') }}"
          echo "endsWith: ${{ endsWith(inputs.branch, 'in') }}"
          echo "toJSON: ${{ toJSON(inputs) }}"

      - name: Step Condicional en caso no sea master
        if: ${{ inputs.branch != 'master' }}
        run: echo "No estoy en la rama master"
      
      - name: "Step que funciona solo cuando ocurre un Success()"
        if: success()
        run: echo "Todos los steps anteriores fueron exitosos"

      - name: Step que falla intencionalmente por el input
        if: ${{ inputs.forzar_falla == true }}
        run: |
          echo "Fallo intencional"
          exit 1
      - name: "Step que funciona siempre: always()"
        if: always()
        run: echo "Este step siempre se ejecuta, incluso si los anteriores fallan"

      - name: "Step function: failure()"
        if: failure()
        run: echo "Este step solo se ejecuta si algún step anterior falla"
      
      - name: "Step function: cancelled()"
        if: cancelled()
        run: echo "Este step solo se ejecuta cuando el workflow fue cancelado por el usuario"
      