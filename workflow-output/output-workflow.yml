name: workflow reutilizable con parametros

on:
  push:
    branches:
      - master


jobs:
  builder:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - id: version
        run: echo "::set-output name=version::$(npm -v)"

  deploy:
    runs-on: ubuntu-latest
    needs: builder
    steps:
      - name: Mostrar versión de npm
        run: |
          echo "Versión de npm: ${{ needs.builder.outputs.version }}"

